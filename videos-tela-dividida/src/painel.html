<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Playfair'; src:url('fontes/playfair-display-latin-800-normal.woff2'); font-weight:800; }
  @font-face { font-family:'Playfair'; src:url('fontes/playfair-display-latin-900-normal.woff2'); font-weight:900; }
  @font-face { font-family:'Playfair'; src:url('fontes/playfair-display-latin-800-italic.woff2'); font-weight:800; font-style:italic; }
  @font-face { font-family:'Caveat'; src:url('fontes/caveat-latin-700-normal.woff2'); font-weight:700; }
  @font-face { font-family:'Montserrat'; src:url('fontes/montserrat-latin-700-normal.woff2'); font-weight:700; }
  :root { --creme:#FDF3E7; --laranja:#F97316; --marrom:#3B2A20; --ferrugem:#B5451B; --verde:#4F6B3F; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:960px; overflow:hidden; }
  body { font-variant-numeric:lining-nums; background:var(--creme); font-family:'Playfair',serif; color:var(--marrom); position:relative; }
  .fundo { position:absolute; inset:0; background:radial-gradient(ellipse at 90% 0%, #FFE6CC 0%, rgba(255,230,204,0) 55%); }
  .estrela { position:absolute; right:70px; top:60px; font-size:64px; color:var(--laranja); }
  .scene { position:absolute; inset:0; padding:60px 80px; display:flex; flex-direction:column;
           justify-content:center; align-items:center; text-align:center; gap:30px; opacity:0; }
  .item { opacity:0; }
  .num { width:96px; height:96px; border-radius:50%; background:var(--laranja); color:#fff; font-family:'Montserrat'; font-weight:700;
         font-size:54px; display:flex; align-items:center; justify-content:center; }
  .titulo { font-weight:800; font-size:100px; line-height:1.12; letter-spacing:-1px; }
  .titulo .w { display:inline-block; opacity:0; margin:0 .12em; }
  .titulo em { font-style:italic; color:var(--laranja); background:linear-gradient(transparent 86%, var(--laranja) 86% 94%, transparent 94%); }
  .mao { font-family:'Caveat'; font-weight:700; font-size:92px; line-height:1; color:var(--laranja); }
  .mao u { text-decoration:none; color:var(--marrom); background:linear-gradient(transparent 84%, var(--laranja) 84% 94%, transparent 94%); padding:0 6px; }
  .valor { font-weight:900; font-size:170px; line-height:1; color:var(--laranja); }
  .moldura { position:relative; width:860px; }
  .moldura img { display:block; width:100%; border-radius:30px; box-shadow:0 14px 40px rgba(59,42,32,.22); }
  .moldura svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .capa { height:880px; width:auto; border-radius:26px; box-shadow:0 14px 40px rgba(59,42,32,.28); display:block; }
</style>
</head>
<body>
<div class="fundo"></div><div class="estrela">✦</div>
<script>
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  inout: x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const fmt = (v, dec) => v.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const FADE = 0.9;      // entrada/saída de cada cena: lenta e suave
const ITEM = 0.9;      // entrada de cada item

let scenes = [];

function build(cfg) {
  cfg.scenes.forEach(sc => {
    const el = document.createElement('div');
    el.className = 'scene';
    sc.items = sc.items.map(it => {
      const n = document.createElement('div');
      n.className = 'item';
      if (it.type === 'num') { n.classList.add('num'); n.innerHTML = it.html; }
      else if (it.type === 'titulo') {
        n.classList.add('titulo');
        it.ws = it.html.split(' ').map(w => { const s = document.createElement('span'); s.className = 'w'; s.innerHTML = w; n.appendChild(s); n.appendChild(document.createTextNode(' ')); return s; });
        n.style.opacity = 1;
      }
      else if (it.type === 'mao') { n.classList.add('mao'); n.innerHTML = it.html; }
      else if (it.type === 'valor') { n.classList.add('valor'); }
      else if (it.type === 'capa') { n.innerHTML = '<img class="capa" src="' + it.src + '">'; }
      else if (it.type === 'print') {
        n.classList.add('moldura'); n.style.width = (it.w || 860) + 'px';
        n.innerHTML = '<img src="' + it.src + '"><svg viewBox="' + it.vb + '" fill="none" stroke="#F97316" stroke-width="9" stroke-linecap="round">' +
          it.ovais.map(o => '<ellipse cx="' + o.cx + '" cy="' + o.cy + '" rx="' + o.rx + '" ry="' + o.ry + '" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-2 ' + o.cx + ' ' + o.cy + ')"/>').join('') + '</svg>';
        it.svgs = n.querySelectorAll('ellipse');
      }
      else { n.innerHTML = it.html; }
      el.appendChild(n);
      it.el = n;
      return it;
    });
    document.body.appendChild(el);
    sc.el = el;
  });
  scenes = cfg.scenes;
}

function setT(t) {
  document.querySelector('.estrela').style.opacity = .75 + .25 * Math.sin(t * 1.2);
  scenes.forEach(sc => {
    const o = ease.inout(clamp((t - sc.in) / FADE)) * (sc.out === undefined ? 1 : ease.inout(clamp((sc.out - t) / FADE)));
    sc.el.style.opacity = o;
    sc.items.forEach(it => {
      if (it.type === 'titulo') {
        const n = it.ws.length, gap = it.dur / n;
        it.ws.forEach((w, i) => {
          const p = ease.out(clamp((t - (it.t0 + i * gap)) / 0.7));
          w.style.opacity = p;
          w.style.transform = 'translateY(' + (1 - p) * 18 + 'px)';
        });
        return;
      }
      const p = ease.out(clamp((t - it.t0) / ITEM));
      it.el.style.opacity = p;
      let s = 1, ty = (1 - p) * 22;
      if (it.zoom) s = 1 + it.zoom * clamp((t - it.t0) / (it.zoomDur || 4));   // aproximação lenta
      else s = 0.96 + 0.04 * p;
      it.el.style.transform = 'scale(' + s + ') translateY(' + ty + 'px)';
      if (it.type === 'valor') {
        const q = ease.inout(clamp((t - it.t0) / it.dur));
        it.el.innerHTML = (it.prefix || '') + fmt(it.to * q, it.dec || 0) + (it.suffix || '');
      }
      if (it.type === 'print') {
        it.ovais.forEach((o, i) => { it.svgs[i].style.strokeDashoffset = 1 - ease.inout(clamp((t - o.t0) / 1.2)); });
      }
    });
  });
}
window.start = cfg => { build(cfg); setT(0); };
</script>
</body>
</html>
