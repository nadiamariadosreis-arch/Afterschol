<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Fredoka'; src:url('fontes/FredokaOne-Regular.ttf'); }
  @font-face { font-family:'Amatic'; src:url('fontes/AmaticSC-Bold.ttf'); font-weight:700; }
  :root { --creme:#FFF3B0; --rosa:#F0689B; --branco:#FFFBEF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:960px; overflow:hidden; }
  body { background:#2A1A10; font-family:'Fredoka',sans-serif; color:var(--creme); position:relative; }
  /* fundo: mesa aconchegante, luz dourada de fim de tarde */
  .fundo { position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 85% 8%, rgba(255,196,96,.55) 0%, rgba(255,196,96,0) 45%),
      radial-gradient(ellipse at 10% 100%, rgba(240,104,155,.16) 0%, rgba(240,104,155,0) 50%),
      linear-gradient(180deg, #4A2E1B 0%, #2A1A10 100%); }
  .luz { position:absolute; border-radius:50%; background:rgba(255,214,130,.20); filter:blur(6px); }
  .scene { position:absolute; inset:0; padding:60px 80px; display:flex; flex-direction:column;
           justify-content:center; align-items:center; text-align:center; gap:30px; opacity:0; }
  .item { opacity:0; }
  .num { font-size:60px; color:var(--rosa); line-height:1; }
  .titulo { font-size:100px; line-height:1.12; text-transform:lowercase; letter-spacing:-1px; }
  .titulo .w { display:inline-block; opacity:0; margin:0 .12em; }
  .titulo em { font-style:normal; font-size:1.3em; background:linear-gradient(transparent 62%, rgba(255,243,176,.30) 62% 90%, transparent 90%); }
  .mao { font-family:'Amatic'; font-weight:700; font-size:92px; line-height:1; color:var(--branco); }
  .mao u { text-decoration:none; background:linear-gradient(transparent 80%, var(--rosa) 80% 92%, transparent 92%); padding:0 6px; }
  .valor { font-size:170px; line-height:1; color:var(--creme); }
  .valor small { font-size:.42em; }
  .estrela { color:var(--creme); font-size:54px; }
  .moldura { position:relative; width:860px; }
  .moldura img { display:block; width:100%; border-radius:30px; box-shadow:0 20px 50px rgba(0,0,0,.45); }
  .moldura svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .capa { height:880px; width:auto; border-radius:26px; box-shadow:0 20px 50px rgba(0,0,0,.5); display:block; }
</style>
</head>
<body>
<div class="fundo"></div>
<script>
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  inout: x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const fmt = (v, dec) => v.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const FADE = 0.9;      // entrada/saída de cada cena: lenta e suave
const ITEM = 0.9;      // entrada de cada item

// bolinhas de luz douradas, bem lentas
[[120,140,150],[880,90,110],[960,720,170],[60,820,120],[520,40,90]].forEach(([x,y,r],i) => {
  const d = document.createElement('div'); d.className = 'luz';
  d.style.cssText = `left:${x - r/2}px;top:${y - r/2}px;width:${r}px;height:${r}px`;
  d.dataset.i = i; document.body.appendChild(d);
});

let scenes = [];

function build(cfg) {
  cfg.scenes.forEach(sc => {
    const el = document.createElement('div');
    el.className = 'scene';
    sc.items = sc.items.map(it => {
      const n = document.createElement('div');
      n.className = 'item';
      if (it.type === 'num') { n.classList.add('num'); n.innerHTML = it.html; }
      else if (it.type === 'titulo') {
        n.classList.add('titulo');
        it.ws = it.html.split(' ').map(w => { const s = document.createElement('span'); s.className = 'w'; s.innerHTML = w; n.appendChild(s); n.appendChild(document.createTextNode(' ')); return s; });
        n.style.opacity = 1;
      }
      else if (it.type === 'mao') { n.classList.add('mao'); n.innerHTML = it.html; }
      else if (it.type === 'valor') { n.classList.add('valor'); }
      else if (it.type === 'capa') { n.innerHTML = '<img class="capa" src="' + it.src + '">'; }
      else if (it.type === 'print') {
        n.classList.add('moldura'); n.style.width = (it.w || 860) + 'px';
        n.innerHTML = '<img src="' + it.src + '"><svg viewBox="' + it.vb + '" fill="none" stroke="#F0689B" stroke-width="9" stroke-linecap="round">' +
          it.ovais.map(o => '<ellipse cx="' + o.cx + '" cy="' + o.cy + '" rx="' + o.rx + '" ry="' + o.ry + '" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-2 ' + o.cx + ' ' + o.cy + ')"/>').join('') + '</svg>';
        it.svgs = n.querySelectorAll('ellipse');
      }
      else { n.innerHTML = it.html; }
      el.appendChild(n);
      it.el = n;
      return it;
    });
    document.body.appendChild(el);
    sc.el = el;
  });
  scenes = cfg.scenes;
}

function setT(t) {
  document.querySelectorAll('.luz').forEach(d => {
    const i = +d.dataset.i;
    d.style.transform = `translate(${Math.sin(t / 5 + i) * 14}px, ${Math.cos(t / 6 + i) * 10}px)`;
    d.style.opacity = .7 + .3 * Math.sin(t / 3 + i);
  });
  scenes.forEach(sc => {
    const o = ease.inout(clamp((t - sc.in) / FADE)) * (sc.out === undefined ? 1 : ease.inout(clamp((sc.out - t) / FADE)));
    sc.el.style.opacity = o;
    sc.items.forEach(it => {
      if (it.type === 'titulo') {
        const n = it.ws.length, gap = it.dur / n;
        it.ws.forEach((w, i) => {
          const p = ease.out(clamp((t - (it.t0 + i * gap)) / 0.7));
          w.style.opacity = p;
          w.style.transform = 'translateY(' + (1 - p) * 18 + 'px)';
        });
        return;
      }
      const p = ease.out(clamp((t - it.t0) / ITEM));
      it.el.style.opacity = p;
      let s = 1, ty = (1 - p) * 22;
      if (it.zoom) s = 1 + it.zoom * clamp((t - it.t0) / (it.zoomDur || 4));   // aproximação lenta
      else s = 0.96 + 0.04 * p;
      it.el.style.transform = 'scale(' + s + ') translateY(' + ty + 'px)';
      if (it.type === 'valor') {
        const q = ease.inout(clamp((t - it.t0) / it.dur));
        it.el.innerHTML = (it.prefix || '') + fmt(it.to * q, it.dec || 0) + (it.suffix || '');
      }
      if (it.type === 'print') {
        it.ovais.forEach((o, i) => { it.svgs[i].style.strokeDashoffset = 1 - ease.inout(clamp((t - o.t0) / 1.2)); });
      }
    });
  });
}
window.start = cfg => { build(cfg); setT(0); };
</script>
</body>
</html>
